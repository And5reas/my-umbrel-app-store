version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: sparkles-balanca-backend_server_1
      APP_PORT: 8000
      PROXY_AUTH_ADD: false

  server:
    image: linkado36778/sb-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: balanca_tcc
      POSTGRES_PASSWORD: $APP_PASSWORD
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: Smart-Balance
      BASE_URL: https://balanca-backend.andreaswilliamporcel.com.br

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: Smart-Balance
      POSTGRES_USER: balanca_tcc
      POSTGRES_PASSWORD: $APP_PASSWORD
    volumes:
      - sb-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balanca_tcc -d Smart-Balance"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sb-postgres-data:
