services:
  api:
    image: linkado36778/sb-backend:latest
    container_name: sb-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: balanca_tcc
      POSTGRES_PASSWORD: $APP_PASSWORD
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: Smart-Balance
      SQLALCHEMY_DATABASE_URL: postgresql://backend:$APP_PASSWORD@db:5432/Smart-Balance
      BASE_URL: https://balanca-backend.andreaswilliamporcel.com.br
    ports:
      - "8000:8010"

  db:
    image: postgres:18-alpine
    container_name: sb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: Smart-Balance
      POSTGRES_USER: balanca_tcc
      POSTGRES_PASSWORD: $APP_PASSWORD
    volumes:
      - sb-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend -d Smart-Balance"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sb-postgres-data:
